AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 7 - CloudFront（ALB をオリジンとした HTTPS 化 + 任意でカスタムドメイン）
  S3 は使用しない。CloudFront を ALB の前段に置き、HTTPS 対応と独自ドメインを実現する。

# ============================================================
# パラメータ（デプロイ前に phase7-params.json を編集して設定する）
# ============================================================
Parameters:

  AlbDnsName:
    Type: String
    Description: >
      Phase 6 で作成した ALB の DNS 名
      （CloudFormationコンソール → handson-phase6 スタック → 出力タブ → AlbDnsName の値）

  DomainName:
    Type: String
    Default: ""
    Description: >
      【任意】カスタムドメイン名（例: handson.example.com）
      独自ドメインを使わない場合は空のままでOK
      設定する場合は AcmCertificateArn も必須

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      【任意・DomainName設定時は必須】
      us-east-1（バージニア）で発行した ACM 証明書の ARN
      ※ CloudFront 用の証明書は必ず us-east-1 で作成すること
      （ACMコンソール → バージニア北部リージョンに切り替えて確認）

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      【任意・Route53でDNS管理している場合】
      Route 53 ホストゾーンの ID
      （Route 53コンソール → ホストゾーン → ホストゾーンID）

  WebAclArn:
    Type: String
    Default: ""
    Description: >
      【任意・WAFを設定する場合】
      us-east-1（バージニア）で作成した WAF Web ACL の ARN
      ※ CloudFront 用 WAF は必ず us-east-1 で作成すること
      （WAF & Shieldコンソール → Web ACLs → handson-webacl → ARN をコピー）

# ============================================================
# 条件分岐
# ============================================================
Conditions:
  # DomainName と AcmCertificateArn の両方が設定されている場合にカスタムドメインを使用
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]

  # Route 53 で DNS レコードも自動作成する場合
  HasRoute53: !And
    - !Condition HasCustomDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

  # WAF Web ACL ARN が設定されている場合に CloudFront に関連付ける
  HasWaf: !Not [!Equals [!Ref WebAclArn, ""]]

# ============================================================
# リソース定義
# ============================================================
Resources:

  # ----------------------------------------------------------
  # CloudFront ディストリビューション
  # ALB をオリジンとして、HTTPS でリクエストを受け付ける
  # ----------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: handson Phase 7
        WebACLId: !If
          - HasWaf
          - !Ref WebAclArn
          - !Ref AWS::NoValue

        # カスタムドメインが設定されている場合のみ有効
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue

        # SSL証明書の設定
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true  # *.cloudfront.net のデフォルト証明書

        # --------------------------------------------------
        # オリジン定義（転送先 = ALB）
        # --------------------------------------------------
        Origins:
          - Id: AlbOrigin
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only  # ALB は HTTP のみ
              HTTPPort: 80

        # --------------------------------------------------
        # デフォルトキャッシュビヘイビア
        # すべてのリクエストを ALB に転送する（キャッシュなし）
        # --------------------------------------------------
        DefaultCacheBehavior:
          TargetOriginId: AlbOrigin
          ViewerProtocolPolicy: redirect-to-https  # HTTP → HTTPS へ自動リダイレクト
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          # CachingDisabled: API・ログイン状態を正しく届けるためキャッシュしない
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewer: Cookie・Authorization ヘッダーなどをすべて ALB に転送する
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

      Tags:
        - Key: Name
          Value: handson-cloudfront

  # ----------------------------------------------------------
  # Route 53 DNS レコード
  # カスタムドメインかつ HostedZoneId が設定されている場合のみ作成
  # ----------------------------------------------------------
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront は必ず Z2FDTNDATAQYW2 のホストゾーンに属する（固定値）
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

# ============================================================
# 出力（デプロイ完了後にコンソールで確認できる値）
# ============================================================
Outputs:

  CloudFrontUrl:
    Description: CloudFront のデフォルト URL（カスタムドメインなしの場合はこちらでアクセス）
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: カスタムドメインの URL
    Value: !Sub "https://${DomainName}"
